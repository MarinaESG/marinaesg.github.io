name: Publish approved portfolio
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type APPROVE PUBLICATION only after Min Gao approves the final preview'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.approval == 'APPROVE PUBLICATION'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate static site
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
